<!-- nav.html -->
<!-- Modern, high-UX navigation for Pilot Travels -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<header id="site-header" aria-hidden="false">
  <div class="wrap nav">
    <div class="brand" aria-hidden="false">
      <div class="logo" aria-hidden="true">PT</div>
      <div class="site-title">
        <strong>Pilot Travels</strong>
        <div class="tiny">Nagercoil · Kanyakumari</div>
      </div>
    </div>

    <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
      <svg width="22" height="14" viewBox="0 0 22 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M1 1h20M1 7h20M1 13h20" stroke="#083445" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>

    <nav id="primary-nav" class="primary" role="navigation" aria-label="Primary navigation">
      <a href="home.html" data-nav="home" class="nav-link" tabindex="0" aria-current="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span class="label">Home</span>
      </a>

      <a href="about.html" data-nav="about" class="nav-link" tabindex="0" aria-current="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 1 7 7v2a7 7 0 0 1-7 7 7 7 0 0 1-7-7V9a7 7 0 0 1 7-7z" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
        <span class="label">About</span>
      </a>

      <a href="bookcars.html" data-nav="bookcars" class="nav-link" tabindex="0" aria-current="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h18v-3a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v3zM6 16v1a2 2 0 0 0 2 2h1v-3H6zm10 0v3h1a2 2 0 0 0 2-2v-1" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="label">Book Cars</span>
      </a>

      <a href="services.html" data-nav="services" class="nav-link" tabindex="0" aria-current="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span class="label">Services</span>
      </a>

      <a href="gallery.html" data-nav="gallery" class="nav-link" tabindex="0" aria-current="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 10l2 2 3-3 5 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="label">Gallery</span>
      </a>

      <a href="contact.html" data-nav="contact" class="nav-link" tabindex="0" aria-current="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8v6a2 2 0 0 1-2 2H7l-4 3V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
        <span class="label">Contact</span>
      </a>

      <!-- the moving active indicator -->
      <div id="active-indicator" aria-hidden="true"></div>
    </nav>

    <div class="nav-actions">
      <button id="theme-toggle" class="btn-ghost" title="Toggle theme" aria-pressed="false">Theme</button>
      <button id="login-btn" class="btn-cta">Login / Book</button>
    </div>
  </div>
</header>

<style>
  :root{
    --accent:#0b63a5; --accent-2:#0b9bd8;
    --bg: #ffffff;
    --muted: #55606a;
    --shadow: 0 14px 40px rgba(6,20,40,0.08);
    --glass: rgba(11,99,165,0.06);
    --radius: 12px;
  }

  /* layout */
  header#site-header{position:sticky;top:0;z-index:1200;background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.92));backdrop-filter:blur(6px);border-bottom:1px solid rgba(6,20,40,0.04)}
  .wrap{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}
  .brand{display:flex;gap:14px;align-items:center}
  .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-family:"Poppins",sans-serif;font-size:18px;box-shadow:0 6px 20px rgba(11,99,165,0.12)}
  .site-title strong{font-family:"Poppins",sans-serif;letter-spacing:0.2px}
  .tiny{font-size:13px;color:var(--muted)}

  /* nav */
  nav.primary{display:flex;gap:6px;align-items:center;position:relative;padding:6px}
  .nav-link{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-family:"Poppins",sans-serif;font-weight:500;font-size:15px;transition:all .18s}
  .nav-link .icon{width:18px;height:18px;opacity:.86}
  .nav-link .label{display:inline-block}

  .nav-link:hover{background:var(--glass);transform:translateY(-3px);color: #042032}
  .nav-link:focus-visible{outline:0;box-shadow:0 0 0 6px rgba(11,99,165,0.12);border-radius:10px}

  /* active visuals (background + forced white text) */
  .nav-link.active{
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#fff !important;
    transform:none;
    box-shadow:var(--shadow);
    font-weight:600;
  }

  /* sliding indicator */
  #active-indicator{position:absolute;bottom:-8px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:transform .28s cubic-bezier(.2,.9,.2,1), width .28s cubic-bezier(.2,.9,.2,1), left .28s;box-shadow:0 6px 18px rgba(11,99,165,0.14);pointer-events:none;will-change:left,width,transform}

  /* actions */
  .nav-actions{display:flex;gap:10px;align-items:center}
  .btn-ghost{background:transparent;border:1px solid rgba(11,99,165,0.08);padding:8px 10px;border-radius:10px;cursor:pointer;font-family:"Poppins",sans-serif}
  .btn-cta{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white;padding:10px 14px;border-radius:12px;border:0;font-weight:700;cursor:pointer;font-family:"Poppins",sans-serif;box-shadow:0 12px 30px rgba(11,99,165,0.14)}

  /* responsive */
  .nav-toggle{display:none;background:transparent;border:0;padding:8px;border-radius:8px;cursor:pointer}
  @media (max-width:880px){
    .wrap{padding:12px}
    nav.primary{position:fixed;left:0;right:0;top:74px;background:rgba(255,255,255,0.98);flex-direction:column;gap:6px;padding:12px;border-bottom-left-radius:12px;border-bottom-right-radius:12px;box-shadow:0 14px 40px rgba(6,20,40,0.06);transform:translateY(-6px);opacity:0;pointer-events:none;transition:opacity .22s, transform .22s}
    nav.primary.open{opacity:1;transform:translateY(0);pointer-events:auto}
    .nav-link{width:calc(100% - 28px);padding:12px 16px}
    #active-indicator{display:none}
    .nav-toggle{display:inline-flex}
    .nav-actions{gap:8px}
  }
</style>

<script>
(function(){
  const nav = document.getElementById('primary-nav');
  const links = Array.from(nav.querySelectorAll('.nav-link'));
  const indicator = document.getElementById('active-indicator');
  const toggle = document.getElementById('nav-toggle');
  const loginBtn = document.getElementById('login-btn');
  const themeBtn = document.getElementById('theme-toggle');

  // Utility: set active visually & update aria/current
  function setActive(el){
    links.forEach(l => { l.classList.remove('active'); l.setAttribute('aria-current','false'); });
    if(!el) return;
    el.classList.add('active');
    el.setAttribute('aria-current','page');
    moveIndicatorTo(el);
  }

  // Move the sliding indicator below the active link
  function moveIndicatorTo(el){
    if(!indicator || !el) return;
    const r = el.getBoundingClientRect();
    const navRect = nav.getBoundingClientRect();
    const left = r.left - navRect.left;
    const width = Math.max(28, r.width);
    indicator.style.left = (left + 8) + 'px';
    indicator.style.width = (width - 16) + 'px';
    indicator.style.transform = 'translateX(0)';
  }

  // On click, give immediate feedback and allow normal navigation or injector to fetch
  links.forEach(link => {
    link.addEventListener('click', (e) => {
      // immediate feedback
      setActive(link);

      // close mobile nav on selection (if open)
      if(nav.classList.contains('open')) {
        nav.classList.remove('open');
        toggle.setAttribute('aria-expanded','false');
      }

      // allow default navigation or your home-injector to handle the link
    });

    // keyboard support: Enter/Space
    link.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        link.click();
      }
    });
  });

  // Determine initial active based on URL (filename or hash)
  function initActiveFromLocation(){
    const path = (location.pathname || '').split('/').pop().toLowerCase() || 'home.html';
    let matched = links.find(a => (a.getAttribute('href') || '').split('/').pop().toLowerCase() === path);
    if(!matched){
      const hash = (location.hash || '').replace('#','').toLowerCase();
      if(hash) matched = links.find(a => (a.dataset.nav || '').toLowerCase() === hash);
    }
    if(matched){
      setActive(matched);
    } else {
      setActive(links[0]);
    }
  }

  // reposition indicator on resize/scroll to remain aligned
  let resizeTimer;
  function onResize(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const active = nav.querySelector('.nav-link.active');
      if(active) moveIndicatorTo(active);
    }, 80);
  }

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  window.addEventListener('scroll', () => {
    const active = nav.querySelector('.nav-link.active');
    if(active) moveIndicatorTo(active);
  }, { passive:true });

  // mobile toggle
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(open));
  });

  // theme toggle (preserve behavior)
  (function initTheme(){
    const KEY = 'theme_v2';
    const saved = localStorage.getItem(KEY) || (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', saved);
    if(themeBtn) themeBtn.setAttribute('aria-pressed', String(saved === 'dark'));
    if(themeBtn){
      themeBtn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem(KEY, next);
        themeBtn.setAttribute('aria-pressed', String(next === 'dark'));
      });
    }
  })();

  // login/book button behavior (keeps previous redirect target)
  if(loginBtn) loginBtn.addEventListener('click', ()=> location.href = 'customer.html');

  // keep active in sync with navigation (back/forward)
  window.addEventListener('popstate', initActiveFromLocation);
  window.addEventListener('hashchange', initActiveFromLocation);

  // initialize
  initActiveFromLocation();
  // small delay to allow layout -> compute indicator
  setTimeout(()=> {
    const active = nav.querySelector('.nav-link.active') || links[0];
    if(active) moveIndicatorTo(active);
  }, 120);
})();
</script>
